server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Auth service: login (public) and user management. The auth service enforces
    # its own admin checks on user management, so no gateway authz is applied here.
    location /api/v1/user-management {
        proxy_pass http://releaseit-auth:8001;
    }

    # Backend API: this nginx is the policy-enforcement point. Every request is
    # authorized at the edge by the auth service (POST /auth + the shared policy);
    # the backend itself no longer validates tokens. On success the auth service
    # returns the caller's identity, which we forward to the backend.
    location /api {
        auth_request /_authz;
        auth_request_set $authz_subject $upstream_http_x_auth_subject;
        auth_request_set $authz_roles   $upstream_http_x_auth_roles;
        proxy_set_header X-Auth-Subject $authz_subject;
        proxy_set_header X-Auth-Roles   $authz_roles;
        proxy_pass http://releaseit-backend:8000;
    }

    # Internal authorization subrequest -> auth service. The auth service reads
    # the original method/URI from these headers and the bearer token from the
    # forwarded Authorization header.
    location = /_authz {
        internal;
        proxy_pass http://releaseit-auth:8001/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }
}
